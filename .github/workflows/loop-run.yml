name: Loop Run (Reusable)

# Reusable workflow for shared checkout, policy, state, dry-run, and reporting behavior
# across all three loop workflows (issue-intake, ci-sweeper, pr-babysitter)
on:
  workflow_call:
    inputs:
      loop-name:
        description: 'Loop pattern name (issue-intake, ci-sweeper, pr-babysitter)'
        required: true
        type: string
      dry-run:
        description: 'Run in dry-run mode (report only, no mutations)'
        required: false
        type: boolean
        default: true
      mode:
        description: 'Loop mode (l1 or l2)'
        required: false
        type: string
        default: 'l1'
      source-ref:
        description: 'Source reference (issue number, PR number, workflow run ID)'
        required: false
        type: string
        default: ''
    secrets:
      GITHUB_TOKEN:
        description: 'GitHub token for API access'
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

# Prevent concurrent runs for the same loop pattern + ref
concurrency:
  group: loop-${{ inputs.loop-name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-loop:
    name: Run ${{ inputs.loop-name }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run loop doctor
        run: npm run loop:doctor
      
      - name: Run loop pattern
        run: |
          node scripts/loop/cli.mjs run \
            --pattern "${{ inputs.loop-name }}" \
            --mode "${{ inputs.mode }}" \
            --dry-run "${{ inputs.dry-run }}" \
            --source "${{ inputs.source-ref }}"
      
      - name: Generate summary
        if: always()
        run: |
          echo "## Loop Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Pattern:** ${{ inputs.loop-name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry-run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Source:** ${{ inputs.source-ref || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See workflow logs for detailed output." >> $GITHUB_STEP_SUMMARY
